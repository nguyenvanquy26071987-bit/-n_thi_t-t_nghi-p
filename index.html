<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 100 Ô Vuông Toán Học - Thầy Quý</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .game-title {
            color: #ffffff;
            font-size: 36px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            text-align: center;
        }
        .progress-text {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
        
        /* GRID 10x10 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 900px;
            width: 100%;
        }
        .grid-item {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #4facfe;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
        }
        .grid-item:hover {
            background: #00f2fe;
            transform: scale(1.05);
        }
        .grid-item.completed {
            background: #28a745;
            color: white;
            cursor: default;
            transform: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .grid-item.completed::after {
            content: '✔';
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
        }

        /* MODAL (HỘP THOẠI CÂU HỎI) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }
        .close-btn:hover { color: #e83e8c; }
        
        .question {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: bold;
            line-height: 1.5;
            text-align: left;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-option {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 15px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #333;
            text-align: left;
        }
        .btn-option:hover {
            background: #f7f9fa;
            border-color: #74ebd5;
        }
        .btn-option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .btn-option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            animation: shake 0.4s;
        }
        .explanation {
            display: none;
            margin-top: 25px;
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
            font-size: 16px;
            line-height: 1.5;
            color: #856404;
        }
        .feedback-correct {
            color: #28a745;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
            display: block;
        }
        .btn-back-grid {
            display: none;
            margin-top: 20px;
            background: #e83e8c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-back-grid:hover {
            background: #c23074;
            transform: scale(1.05);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(5, 1fr); gap: 5px; }
            .options { grid-template-columns: 1fr; }
        }
    </style>
</head>

    const completed = new Array(100).fill(false);
    let currentQIndex = -1;
    let solvedCount = 0;

    const gridContainer = document.getElementById('grid');
    const modal = document.getElementById('questionModal');
    const qText = document.getElementById('q-text');
    const qOptions = document.getElementById('q-options');
    const explanationBox = document.getElementById('explanation');
    const expText = document.getElementById('exp-text');
    const btnBackGrid = document.getElementById('btn-back-grid');
    const solvedCountText = document.getElementById('solved-count');

    // Khởi tạo 100 ô vuông
    for (let i = 0; i < 100; i++) {
        const box = document.createElement('div');
        box.className = 'grid-item';
        box.innerText = i + 1;
        box.onclick = () => openQuestion(i, box);
        gridContainer.appendChild(box);
    }

    function openQuestion(index, boxElement) {
        if (completed[index]) return; // Nếu đã làm xong thì không mở lại

        currentQIndex = index;
        const q = questions[index];
        
        qText.innerHTML = q.q;
        qOptions.innerHTML = '';
        explanationBox.style.display = 'none';
        btnBackGrid.style.display = 'none';
        
        q.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(idx, btn, index, boxElement);
            qOptions.appendChild(btn);
        });

        modal.style.display = 'flex';
    }

    function checkAnswer(selectedIdx, btnElement, qIndex, boxElement) {
        if (completed[qIndex]) return;

        const q = questions[qIndex];
        if (selectedIdx === q.ans) {
            // ĐÚNG
            btnElement.classList.add('correct');
            completed[qIndex] = true;
            boxElement.classList.add('completed');
            
            solvedCount++;
            solvedCountText.innerText = solvedCount;

            expText.innerHTML = q.exp;
            explanationBox.style.display = 'block';
            btnBackGrid.style.display = 'inline-block';
            
            const allBtns = qOptions.getElementsByClassName('btn-option');
            for(let b of allBtns) b.style.pointerEvents = 'none';
            
            if (solvedCount === 100) {
                setTimeout(() => alert("XUẤT SẮC! CÁC EM ĐÃ CHINH PHỤC TOÀN BỘ 100 Ô VUÔNG!"), 500);
            }

        } else {
            // SAI
            btnElement.classList.add('wrong');
            let originalText = btnElement.innerHTML;
            btnElement.innerText = "Cố gắng chọn lại nhé";
            setTimeout(() => {
                btnElement.classList.remove('wrong');
                btnElement.innerHTML = originalText;
            }, 1200);
        }
    }

    function closeModal() {
        modal.style.display = 'none';
    }
    
    // Đóng khi click ra ngoài hộp thoại
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
